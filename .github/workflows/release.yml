name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read the plugin version
        id: plugin
        run: |
          set -euo pipefail
          manifest=chatgpt/mgt-quoting/.codex-plugin/plugin.json
          if [ ! -f "${manifest}" ]; then
            manifest=chatgpt/mgt-quoting/plugin.json
          fi
          version="$(jq -r .version "${manifest}")"
          if [ -z "${version}" ] || [ "${version}" = "null" ]; then
            echo "::error::${manifest} has no version"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=mgt-quoting-v${version}" >> "$GITHUB_OUTPUT"

      - name: Check for an existing release
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.plugin.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${TAG} already exists, so there is nothing to release. Raise the version in chatgpt/mgt-quoting/.codex-plugin/plugin.json to publish a new ZIP."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the ZIP
        if: ${{ steps.existing.outputs.exists == 'false' }}
        run: node scripts/build-chatgpt-zip.mjs chatgpt/mgt-quoting mgt-quoting.zip

      - name: Create the release
        if: ${{ steps.existing.outputs.exists == 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.plugin.outputs.tag }}
          VERSION: ${{ steps.plugin.outputs.version }}
        run: |
          gh release create "${TAG}" mgt-quoting.zip \
            --target "${GITHUB_SHA}" \
            --title "MGT Quoting ${VERSION}" \
            --notes "ChatGPT plugin package for MGT Quoting ${VERSION}. Upload mgt-quoting.zip in OpenAI's plugin portal." \
            --latest
