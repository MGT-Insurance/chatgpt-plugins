name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read the plugin version
        id: plugin
        run: |
          set -euo pipefail
          manifest="chatgpt/mgt-quoting/.codex-plugin/plugin.json"
          if [ ! -f "${manifest}" ]; then
            manifest="chatgpt/mgt-quoting/plugin.json"
          fi
          version="$(jq -r .version "${manifest}")"
          if [ -z "${version}" ] || [ "${version}" = "null" ]; then
            echo "::error::${manifest} has no version"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=mgt-quoting-v${version}" >> "$GITHUB_OUTPUT"

      - name: Check for an existing release
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.plugin.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${TAG} already exists, so there is nothing to release. Raise the version in both chatgpt/mgt-quoting/.codex-plugin/plugin.json and chatgpt/mgt-quoting/plugin.json to publish new ZIPs."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the ZIPs
        if: ${{ steps.existing.outputs.exists == 'false' }}
        run: |
          set -euo pipefail
          node scripts/build-chatgpt-zip.mjs chatgpt/mgt-quoting dist
          for zip in dist/mgt-quoting-upload.zip dist/mgt-quoting-desktop.zip; do
            if [ ! -f "${zip}" ]; then
              echo "::error::The build did not produce ${zip}"
              exit 1
            fi
            unzip -l "${zip}"
          done

      - name: Create the release
        if: ${{ steps.existing.outputs.exists == 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.plugin.outputs.tag }}
          VERSION: ${{ steps.plugin.outputs.version }}
        run: |
          notes="ChatGPT plugin packages for MGT Quoting ${VERSION}.

          mgt-quoting-upload.zip is the package you upload in OpenAI's plugin portal.

          mgt-quoting-desktop.zip is the package internal testers install in ChatGPT desktop."
          gh release create "${TAG}" \
            dist/mgt-quoting-upload.zip \
            dist/mgt-quoting-desktop.zip \
            --target "${GITHUB_SHA}" \
            --title "MGT Quoting ${VERSION}" \
            --notes "${notes}" \
            --latest
